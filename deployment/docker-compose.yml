services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://jlpt_lms:jlpt_lms@postgres:5432/jlpt_lms
      JWT_SECRET_KEY: change-me-in-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      AUTO_CREATE_TABLES: "true"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ../content:/app/content:ro
      - ../quizzes:/app/quizzes:ro
      - ../flashcards:/app/flashcards:ro

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: jlpt_lms
      POSTGRES_USER: jlpt_lms
      POSTGRES_PASSWORD: jlpt_lms
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../database/seed/phase1_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

volumes:
  postgres-data:
