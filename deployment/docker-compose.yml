services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://jlpt_lms:jlpt_lms@postgres:5432/jlpt_lms
      JWT_SECRET_KEY: change-me-in-production
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: jlpt_lms
      POSTGRES_USER: jlpt_lms
      POSTGRES_PASSWORD: jlpt_lms
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../database/seed/phase1_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

volumes:
  postgres-data:

