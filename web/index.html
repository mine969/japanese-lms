<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>日本語大学 | Static JLPT LMS</title>
    <link rel="stylesheet" href="assets/styles.css?v=20260611-mobile2" />
  </head>
  <body>
    <header class="mobile-header">
      <div class="mobile-title">
        <span class="brand-mark">æ—¥</span>
        <div>
          <strong>æ—¥æœ¬èªžå¤§å­¦</strong>
          <span>Static JLPT LMS</span>
        </div>
      </div>
      <button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-expanded="false" aria-controls="sidebar">Lessons</button>
    </header>
    <div class="mobile-backdrop" id="mobileBackdrop" hidden></div>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">日</div>
          <div>
            <h1>日本語大学</h1>
            <p>JLPT 0→N1 Static LMS</p>
          </div>
        </div>

        <div class="status-grid" id="statusGrid"></div>

        <nav class="quick-nav" aria-label="Primary LMS areas">
          <button type="button" data-route="dashboard">Home</button>
          <button type="button" data-route="lesson">Lesson</button>
          <button type="button" data-route="courses">Courses</button>
          <button type="button" data-route="package">Package</button>
          <button type="button" data-route="sources">Sources</button>
          <button type="button" data-route="progress">Progress</button>
        </nav>

        <label class="search-box">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="N5-M01-L04, grammar, mock..." />
        </label>

        <div class="filters" id="levelFilters"></div>
        <nav class="lesson-list" id="lessonList" aria-label="Learning path"></nav>
      </aside>

      <main class="main-panel">
        <nav class="page-tabs" aria-label="Page navigation">
          <button type="button" data-route="dashboard">Dashboard</button>
          <button type="button" data-route="lesson">Lesson</button>
          <button type="button" data-route="courses">Courses</button>
          <button type="button" data-route="package">LMS Package</button>
          <button type="button" data-route="sources">Source Library</button>
          <button type="button" data-route="progress">Progress</button>
        </nav>

        <section class="dashboard-panel view-panel" id="dashboardPanel" aria-label="LMS dashboard"></section>
        <section class="view-panel" id="coursesPanel" aria-label="Course structure"></section>
        <section class="view-panel" id="packagePanel" aria-label="LMS package exports"></section>
        <section class="view-panel" id="sourcesPanel" aria-label="Source library"></section>
        <section class="view-panel" id="progressPanel" aria-label="Progress overview"></section>

        <section class="view-panel" id="lessonPanel" aria-label="Lesson reader">
          <header class="topbar">
            <div>
              <p class="eyebrow" id="activeMeta">Static, zero-budget, no backend required</p>
              <h2 id="activeTitle">Loading LMS...</h2>
            </div>
            <div class="actions">
              <button id="toggleComplete" class="primary-button" type="button">Mark Complete</button>
              <button id="resetProgress" class="ghost-button" type="button">Reset Progress</button>
            </div>
          </header>

          <section class="overview-band" id="overviewBand"></section>

          <nav class="section-tabs" id="sectionTabs" aria-label="Lesson sections"></nav>

          <article class="content-view" id="contentView">
            <p>Loading curriculum data...</p>
          </article>
        </section>
      </main>
    </div>

    <script src="assets/app.js?v=20260611-mobile2"></script>
  </body>
</html>
